[project]
name = "livefold"
version = "0.0.0"
description = "A simple library for performing Square Root Decomposition and Aggregation"
readme = "README.md"
authors = [{ name="Daniel Cahall", email="danielenricocahall@gmail.com" }]
requires-python = ">=3.10"
dependencies = []
license-files = ["LICENSE"]

[project.urls]
"Source code" = "https://github.com/danielenricocahall/livefold"

[tool.uv]

[dependency-groups]
dev = [
    "pre-commit>=4.1.0",
    "pytest>=8.3.4",
    "ruff>=0.9.5",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
  "/.*",
  "/tests",
    "/benchmarks",
    "README.md",
    "CONTRIBUTING.md"
]

[tool.hatch.build.targets.wheel]
packages = ["livefold"]
include = ["livefold/py.typed"]
